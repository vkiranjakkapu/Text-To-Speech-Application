database:
    host: localhost
    port: 5432
    name: tts_transformer

eureka:
    client:
        webclient:
            enabled: true

azure:
    speech:
        key: ${AZURE_SPEECH_KEY}
        region: ${AZURE_SPEECH_REGION}
    storage:
        connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
        container-name: ${AZURE_STORAGE_CONTAINER}

app:
    request:
        max-char-length: 55
    limits:
        max-monthly-limit: 10000
